<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Navy squircle base -->
  <rect width="64" height="64" rx="14" fill="#092634" />
  <rect width="62" height="62" x="1" y="1" rx="13" stroke="#F9F9F9" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- Blue Agent Loop (Left to Center Knot) -->
  <path d="M18 20 C18 36, 26 44, 32 32 C38 20, 46 28, 46 44" stroke="#004E72" stroke-width="4.5" stroke-linecap="round" />

  <!-- Orange Agent Loop (Right to Center Knot - Interlaced) -->
  <path d="M46 44 C46 28, 38 20, 32 32 C26 44, 18 36, 18 20" stroke="#FF6E42" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="18 6" />

  <!-- Central Interlocking Knot Nexus -->
  <circle cx="32" cy="32" r="4.5" fill="#092634" stroke="#F9F9F9" stroke-width="2.5" />
  <circle cx="32" cy="32" r="1.5" fill="#F9F9F9" />

  <!-- Agent 1 Node (Top-Left: Blue with White Pip) -->
  <circle cx="18" cy="20" r="7" fill="#004E72" stroke="#F9F9F9" stroke-width="2" />
  <circle cx="18" cy="20" r="2.5" fill="#F9F9F9" />

  <!-- Agent 2 Node (Bottom-Right: Orange with White Pip) -->
  <circle cx="46" cy="44" r="7" fill="#FF6E42" stroke="#F9F9F9" stroke-width="2" />
  <circle cx="46" cy="44" r="2.5" fill="#F9F9F9" />
</svg>
