name: Knot CI Pipeline

on:
  push:
    branches:
      - main
      - feat/threadline-branding-desktop-commander-manager
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================================
  # Job A — Static Validation
  # =========================================================================
  static-validation:
    name: Static Validation (Typecheck, Lint & Security Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type checking
        run: npm run typecheck

      - name: ESLint static analysis
        run: npm run lint

      - name: Automated dependency security audit
        run: node scripts/audit-dependencies.mjs

  # =========================================================================
  # Job B — Automated Test Suite & Coverage
  # =========================================================================
  test-suite:
    name: Automated Unit & Security Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite with JUnit and Coverage
        run: |
          npx vitest run --exclude "**/antigravity.smoke.test.ts" \
            --reporter=default \
            --reporter=junit \
            --outputFile=test-results.xml \
            --coverage

      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: test-results.xml
          if-no-files-found: error

      - name: Upload code coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/
          if-no-files-found: error

  # =========================================================================
  # Job C — Production Build
  # =========================================================================
  production-build:
    name: Production Bundle Build & Asset Verification
    needs: [static-validation, test-suite]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundles (Renderer, Main, Preload)
        run: npm run build

      - name: Verify build outputs and bundles
        run: |
          echo "Verifying generated distribution assets..."
          test -f dist/renderer/index.html || { echo "❌ Missing dist/renderer/index.html"; exit 1; }
          test -f dist/main/index.js || { echo "❌ Missing dist/main/index.js"; exit 1; }
          test -f dist/preload/index.js || { echo "❌ Missing dist/preload/index.js"; exit 1; }
          echo "✅ All expected bundle entrypoints verified."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/
          if-no-files-found: error

  # =========================================================================
  # Job D — Linux Packaging Verification
  # =========================================================================
  linux-packaging:
    name: Linux AppImage Packaging & Integrity Gate
    needs: [production-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package Linux AppImage and directory
        run: npm run pack

      - name: Execute automated packaging verification gate
        run: node scripts/verify-packaging.mjs

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Knot-Linux-AppImage
          path: release/*.AppImage
          if-no-files-found: error
